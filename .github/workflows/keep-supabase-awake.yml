# Keeps the website's free Supabase project (loan calculator sign-in) from being
# paused for inactivity: Supabase pauses free projects after 7 days without use.
# Runs every 3 days and can also be started by hand from the Actions tab.
# Uses only the public publishable key that is already in site.js.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 1 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the website's sign-in check
        run: |
          code=$(curl -s -o /tmp/out.txt -w "%{http_code}" -m 30 -X POST \
            "https://hwmbccnelkljrvaeajcx.supabase.co/rest/v1/rpc/calc_returning_signin" \
            -H "apikey: sb_publishable_cPLjL811Xvp4AgBLFnsyVQ_fB32ggTH" \
            -H "Content-Type: application/json" \
            -d '{"p_email":"keepalive@example.invalid"}')
          echo "HTTP $code: $(cat /tmp/out.txt)"
          test "$code" = "200"
